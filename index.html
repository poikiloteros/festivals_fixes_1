<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus f v2 — loader + hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    /* A stand-in for the home hero of the site (same fonts, sizes, colours and f box). */
    html, body { margin: 0; }
    body { background: #F9F7F2; color: #261D16; font-weight: 500; -webkit-font-smoothing: antialiased; }
    .hero {
      min-height: 100vh; background: #EFEBE0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .f-slot { width: 128px; height: 176px; margin-bottom: 40px; z-index: 10; }   /* w-32 h-44 mb-10 */
    .hero-text { text-align: center; padding: 0 16px; }
    .hero-title {
      margin: 0; font: 500 60px/1 'Cormorant Garamond', serif; letter-spacing: -0.025em;
    }
    .hero-title span { font: italic 400 48px/1 'Bodoni Moda', serif; }
    .hero-subtitle { margin: 24px 0 0; font: 400 24px/32px 'Bodoni Moda', serif; color: #6B543E; }
    @media (min-width: 768px) {
      .hero-title { font-size: 96px; }
      .hero-title span { font-size: 72px; }
      .hero-subtitle { font-size: 60px; line-height: 1; }
    }
    body.bare .hero-text { display: none; }

    /* The site's fadeUp, started by the papyrus reveal instead of by page load. */
    .hero-title, .hero-subtitle { opacity: 0; transform: translateY(20px); }
    .papyrus-revealed .hero-title { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards; }
    .papyrus-revealed .hero-subtitle { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* Review links, shown on hover at the bottom once the sequence is done. */
    .review {
      position: fixed; right: 18px; bottom: 16px; display: flex; gap: 14px;
      font: 500 11px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase;
      opacity: 0; transition: opacity .25s ease;
    }
    .papyrus-done .review:hover, .review:focus-within { opacity: .85; }
    .review a { color: #8C7355; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  </style>
</head>
<body>
  <script>
    // Review options from the address bar: ?t=2.4 (hold), ?speed=0.5, ?delay=2500 (slow load), ?skip, ?bare
    (function () {
      var q = new URLSearchParams(location.search), cfg = {};
      if (q.has('t')) cfg.freezeAt = parseFloat(q.get('t')) || 0;
      if (q.has('speed')) cfg.speed = parseFloat(q.get('speed')) || 1;
      if (q.has('delay')) cfg.release = 'manual';
      if (q.has('skip')) cfg.skip = true;
      window.PAPYRUS_HERO = cfg;
    })();
  </script>
  <script src="./papyrus-hero-v2.js"></script>

  <section class="hero" id="home">
    <div class="f-slot" data-papyrus-slot></div>
    <div class="hero-text">
      <h1 class="hero-title">Festivals <span>&amp;</span> Society</h1>
      <p class="hero-subtitle">in Ptolemaic and Roman Egypt</p>
    </div>
  </section>

  <nav class="review" aria-label="Review">
    <a href="#" id="replay">Replay</a>
    <a href="?delay=2500">Slow load</a>
    <a href="?speed=0.5">Half speed</a>
  </nav>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has('bare')) document.body.classList.add('bare');
      if (q.has('delay')) addEventListener('load', function () {
        setTimeout(function () { PapyrusHeroV2.release(); }, parseFloat(q.get('delay')) || 0);
      });
      document.getElementById('replay').addEventListener('click', function (e) { e.preventDefault(); location.reload(); });
    })();
  </script>
</body>
</html>
